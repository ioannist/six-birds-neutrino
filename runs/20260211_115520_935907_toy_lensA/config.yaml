run_name: "toy_lensA"
lens:
  type: "gaussian"
  params: ["x1", "x2"]
  mean: [-0.20, -0.10]
  cov:
    - [0.0100, 0.0020]
    - [0.0020, 0.0200]
parameters:
  x1:
    initial: 0.30
    bounds: [0.0, 1.0]
  x2:
    initial: 0.40
    bounds: [-1.0, 1.0]
optimizer:
  method: "L-BFGS-B"
  tol: 1.0e-12
  options:
    maxiter: 2000
