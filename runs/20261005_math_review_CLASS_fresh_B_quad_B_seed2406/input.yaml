notes:
  mnu_prior_choice: N0 found explicit lower bound at 0 eV, but no explicit upper bound
    in 2601.16277; replication choice uses flat [0, 5] eV.
  mnu_class_mapping: CLASS requires m_ncdm input. We sample mnu_sample, output derived
    mnu in chains, and map m_ncdm as 3 degenerate masses mnu_sample/3.
  planck_subset: PR3 low-l TT/EE + PR3 high-l TT (Plik-lite native) with bins_for_L_range
    [30,756]; no high-l TE/EE.
  numerical_control: Common ell_max4095 and tol_ncdm_bg1e-8 only; distinct numerical
    target from both legacy default and seven-setting intermediate chains. Do not
    pool across targets.
  warm_start_fit: Fixed last saved row of the declared immutable ninth snapshot; used
    only as initialization, not as a new-target posterior draw.
  proposal_scope: Shared frozen positive-definite proposal heuristic; no historical
    samples pooled.
  output_precision: 17 significant figures preserve binary64 sampled coordinates.
  sampler_scope: Independent seed and integer holding times; termination is not a
    convergence certificate.
  initialization_scope: Each replica has a distinct parent family and fresh RNG seed.
    Initialization reuses old-target points; no independence or convergence certificate
    follows from that reuse.
  solver_backend: Requires pinned private CLASS finite-Jacobian build; fresh seed
    and files. Do not pool unmodified-backend histories. Initial point and covariance
    are proposal inputs, not posterior certificates.
  classy_backend:
    build_receipt: runs/20261004_math_review_class_python_repair/build_verification_receipt.json
    module_sha256: 7a5d736220b3d236f3dc7c89944d025fe3e4c7cb4c8e4473ef807c898fc71539
  recovery_scope: Fresh RNG and output; original fixed reference used only for initialization.
  numerical_scope: Current guarded native build and current bound Python sources;
    historical floating-target identity not asserted.
