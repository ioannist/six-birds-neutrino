    seed: 1405
    max_samples: 20000
    learn_proposal: true
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.05
    Rminus1_cl_level: 0.95
    oversample_power: 0.4
    oversample_thin: false
    covmat: /home/repos/six-birds-neutrino/runs/20261004_math_review_class_backend_transition/archives/seed702/run/chains/math_accuracy_dragging_B_seed702.covmat
