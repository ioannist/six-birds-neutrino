notes:
  mnu_prior_choice: N0 found explicit lower bound at 0 eV, but no explicit upper bound
    in 2601.16277; replication choice uses flat [0, 5] eV.
  mnu_class_mapping: CLASS requires m_ncdm input. We sample mnu_sample, output derived
    mnu in chains, and map m_ncdm as 3 degenerate masses mnu_sample/3.
  planck_subset: PR3 low-l TT/EE + PR3 high-l TT (Plik-lite native) with bins_for_L_range
    [30,756]; no high-l TE/EE.
  numerical_control: Same physical model, priors, and likelihoods as default-precision
    restoration; seven intermediate CLASS precision settings. Do not pool with default-target
    chains.
  warm_start_fit: Last complete preserved terminal row, initialization only.
  proposal_scope: Preserved learned covariance used as a positive-definite proposal
    heuristic only.
  output_precision: 17 significant figures preserve binary64 sampled coordinates.
  sampler_scope: Independent seed and integer holding times; termination is not a
    convergence certificate.
  sampler_kernel: Upstream Cobaya fast-parameter dragging; internal bridge states
    are not chain draws. Stored integer weights count outer-chain holding times.
  sampler_efficiency_trial: Same intermediate ndf15 likelihood target and priors as
    seeds 601-604; mixing and wall-time improvement remain unverified.
  temperature: Explicit temperature=1 preserves the original posterior target.
  numerical_solver: Requires the manifest-verified separate CLASS3.4.0 finite-Jacobian
    backend. Same seven precision settings and physical likelihood/priors; distinct
    solver build, fresh output and RNG stream. Do not pool with unmodified-backend
    histories.
  classy_backend:
    build_receipt: runs/20261004_math_review_class_python_repair/build_verification_receipt.json
    module_sha256: 7a5d736220b3d236f3dc7c89944d025fe3e4c7cb4c8e4473ef807c898fc71539
  recovery_scope: Fresh replica of preserved target; new RNG and output. No exact
    resume or old-prefix append.
