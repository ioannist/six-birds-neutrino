run_name: cmb_baseline_spt2018_plancksubset_mnu

likelihood:
  sbt_spt_audit.likelihoods.candl_cobaya.CandlCobayaLikelihood:
    dataset_expr: candl_data.SPT3G_2018_TTTEEE_multifreq

  planck_2018_lowl.TT:
    {}

  planck_2018_lowl.EE_sroll2:
    {}

  planck_2018_highl_plik.TT_lite_native:
    path: external/cobaya_packages/data/planck_2018_pliklite_native
    dataset_params:
      use_cl: tt
      bins_for_L_range: [30, 756]

  planckpr4lensing.PlanckPR4Lensing:
    python_path: external/cobaya_packages/code/planck_PR4_lensing

theory:
  classy:
    extra_args:
      N_ncdm: 3
      N_ur: 0.00641

params:
  omegabh2:
    prior: {min: 0.005, max: 0.04}
    ref: 0.02237
    proposal: 0.0002
  omegach2:
    prior: {min: 0.001, max: 0.99}
    ref: 0.1200
    proposal: 0.002
  H0:
    prior: {min: 40, max: 100}
    ref: 67.36
    proposal: 0.6
  logA:
    prior: {min: 1.5, max: 4.0}
    ref: 3.044
    proposal: 0.02
    drop: true
  As:
    value: "lambda logA: 1e-10*np.exp(logA)"
  ns:
    prior: {min: 0.8, max: 1.2}
    ref: 0.9649
    proposal: 0.01
  tau:
    prior: {min: 0.01, max: 0.8}
    ref: 0.0544
    proposal: 0.01
  mnu:
    prior: {min: 0.0, max: 5.0}
    ref: 0.06
    proposal: 0.03
    drop: true
  m_ncdm:
    value: "lambda mnu: '{0:.8f},{0:.8f},{0:.8f}'.format(mnu/3.0)"

  A_planck:
    value: 1.0

notes:
  planck_subset: "PR3 low-l TT/EE + PR3 high-l TT (Plik-lite native) with bins_for_L_range [30,756]; no high-l TE/EE."
  lensing: "PR4 lensing via planckpr4lensing external package path under external/cobaya_packages/code/planck_PR4_lensing."
